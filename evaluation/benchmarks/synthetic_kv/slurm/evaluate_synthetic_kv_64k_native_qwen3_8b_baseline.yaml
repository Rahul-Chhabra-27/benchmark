# 64K Synthetic-KV diagnostic baseline: Qwen3-8B without YaRN.
#
# max_context_length is intentionally null so the pipeline uses the tokenizer
# limit. This measures the model's native positional configuration against the
# existing 64K YaRN-2 baseline; it is expected to be less reliable beyond the
# native context limit.
output_dir: "./results/results_synthetic_kv_64k_native_qwen3_8b_no_yarn_baseline"

model: "/home/rethinkingai-self/25m0820/kvpress/Qwen3-8B"
dataset: "synthetic_kv"
data_dir:
  - "64k"

press_name: "no_press"
compression_ratio: 0.0
memory_budget: null
memory_budget_unit: "MB"

fraction: 1.0
max_new_tokens: null
max_context_length: null
query_aware: false
needle_depth: null
synthetic_kv_metadata_override: false
seed: 42

device: "cuda:0"
fp8: false
int8: false
int4: false
model_kwargs:
  attn_implementation: null
  dtype: "auto"
  # Override the checkpoint's YaRN-4 config with plain/default RoPE.
  rope_scaling: null
  rope_parameters:
    rope_type: "default"
    rope_theta: 1000000.0
  max_position_embeddings: 40960
