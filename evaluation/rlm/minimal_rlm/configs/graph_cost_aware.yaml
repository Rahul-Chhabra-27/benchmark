# The professor's setting: bm25-graph ordering; the root chooses the compression factor per
# read; reads larger than B x F offload the excess KV to CPU; every read reports its cost
# (GPU tokens free, offloaded tokens 100 each) so the root can trade accuracy against cost.
extends: _defaults.yaml
name: graph_cost_aware_1024mb
ordering: bm25-graph
compression:
  budget_mb: 1024
  factor: 1
  choices: [1, 2, 4, 8]
  offload: true
cost:
  gpu_token: 0
  offloaded_token: 100
  show_root: true
